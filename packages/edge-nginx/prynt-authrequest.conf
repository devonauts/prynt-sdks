# Prynt Edge — classic nginx auth_request connector. Gate requests via a subrequest to Prynt's
# /v1/edge/gate: 204 = allow, 403 = block, 200 (challenge) passes through with X-Prynt-Decision.
# Requires the stock ngx_http_auth_request_module (built-in on most distros).

# --- internal subrequest to Prynt ---
location = /__prynt_gate {
    internal;
    proxy_pass                 https://api.pryntid.com/v1/edge/gate;
    proxy_ssl_server_name      on;     # SNI: required to reach an HTTPS host behind Cloudflare
    proxy_method               GET;
    proxy_pass_request_body    off;
    proxy_set_header           Content-Length "";
    proxy_set_header           X-Prynt-Public-Key "pk_live_your_public_key";
    # Your server is the one connecting to Prynt, so vouch for the visitor's IP with the proxy
    # secret from the console (API Keys → First-party proxy); without it Prynt sees this box's IP.
    proxy_set_header           X-Prynt-Client-IP $remote_addr;
    proxy_set_header           X-Prynt-Proxy-Secret "pps_your_proxy_secret";
    proxy_set_header           User-Agent $http_user_agent;
    proxy_set_header           X-Prynt-SDK "edge-nginx/1.0.0";   # connector version (console: SDKs in use)
    # Web Bot Auth (signed AI agents, e.g. ChatGPT agent): the Signature, Signature-Input and
    # Signature-Agent request headers reach Prynt unchanged (auth_request forwards the visitor's
    # headers); Prynt also needs what the agent signed for — this site's host, the method and URI.
    # Trusted only together with the proxy secret above.
    proxy_set_header           X-Prynt-Original-Host   $http_host;
    proxy_set_header           X-Prynt-Original-Method $request_method;
    proxy_set_header           X-Prynt-Original-URI    $request_uri;
    # If your TLS stack exposes JA4 (e.g. a JA4 nginx module), forward it:
    # proxy_set_header         X-JA4 $ssl_ja4;
}

# --- protect your app ---
location / {
    auth_request               /__prynt_gate;
    auth_request_set           $prynt_decision $upstream_http_x_prynt_decision;
    auth_request_set           $prynt_suspect  $upstream_http_x_prynt_suspect;
    error_page 403             = @prynt_blocked;

    proxy_pass                 http://your_upstream;
    proxy_set_header           X-Prynt-Decision $prynt_decision;   # your app can escalate 'challenge'
    proxy_set_header           X-Prynt-Suspect  $prynt_suspect;
}

location @prynt_blocked {
    default_type text/html;
    return 403 "<!doctype html><h1>Access denied</h1><p>Blocked by Prynt.</p>";
}
