name: prynt
description: Prynt Flutter plugin — stable device identity + integrity signals, verified server-side.
version: 1.0.0
homepage: https://pryntid.com
repository: https://github.com/devonauts/prynt-sdks/tree/main/packages/mobile-flutter
issue_tracker: https://github.com/devonauts/prynt-sdks/issues
topics: [fingerprint, fraud, security, device]
environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: dev.prynt.flutter
        pluginClass: PryntPlugin
      ios:
        pluginClass: PryntPlugin
